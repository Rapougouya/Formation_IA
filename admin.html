<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Admin - Validation des inscriptions</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .admin-container { max-width: 1100px; margin: 40px auto; padding: 20px; }
    .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    .admin-header h1 { font-size: 22px; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 24px; }
    .stat-card { background: #fff; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    .stat-card .num { font-size: 28px; font-weight: 700; color: var(--primary); }
    .stat-card .label { font-size: 13px; color: var(--gray-600); }
    table { width: 100%; background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.05); border-collapse: collapse; }
    th { background: var(--gray-50); text-align: left; padding: 14px 16px; font-size: 12px; text-transform: uppercase; color: var(--gray-600); }
    td { padding: 14px 16px; border-top: 1px solid var(--gray-100); font-size: 14px; }
    .badge { padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; }
    .badge-pending { background: #fef3c7; color: #92400e; }
    .badge-valid { background: #d1fae5; color: #065f46; }
    .badge-reject { background: #fee2e2; color: #991b1b; }
    .btn-valid, .btn-reject { padding: 6px 12px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 12px; margin-right: 4px; }
    .btn-valid { background: var(--success); color: #fff; }
    .btn-reject { background: var(--danger); color: #fff; }
    .loading { text-align: center; padding: 40px; color: var(--gray-400); }
  </style>
</head>
<body>
  <div class="admin-container">
    <div class="admin-header">
      <h1>📋 Tableau de bord - Inscriptions</h1>
      <button onclick="chargerInscriptions()" class="btn-secondaire">🔄 Actualiser</button>
    </div>

    <div class="stats">
      <div class="stat-card"><div class="num" id="statTotal">0</div><div class="label">Total inscrits</div></div>
      <div class="stat-card"><div class="num" style="color:var(--warning)" id="statAttente">0</div><div class="label">En attente</div></div>
      <div class="stat-card"><div class="num" style="color:var(--success)" id="statValides">0</div><div class="label">Validés</div></div>
    </div>

    <div id="loading" class="loading">⏳ Chargement des inscriptions...</div>

    <table id="tableInscriptions" style="display:none">
      <thead>
        <tr>
          <th>Date</th>
          <th>N°</th>
          <th>Nom</th>
          <th>Prénom</th>
          <th>Numéro de paiement</th>
          <th>Statut</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  <script src="admin.js"></script>
</body>
</html>
